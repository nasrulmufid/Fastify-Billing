name: fastify-billing
services:
  mysql:
    image: mysql:8.0
    container_name: fasty-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: fasty_bill
      MYSQL_USER: ${DB_USER:-fasty}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme_db}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fasty-net]
  fasty-api:
    build:
      context: ./fasty-api
      dockerfile: Dockerfile
    image: fasty-api:latest
    container_name: fasty-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fasty_bill
      DB_USER: ${DB_USER:-fasty}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change_this_encryption_key_32}
      SUMODOP_BASE_URL: ${SUMODOP_BASE_URL:-https://api-pay-sandbox.sumopod.com}
      SUMODOP_API_KEY: ${SUMODOP_API_KEY:-}
      SUMODOP_WEBHOOK_SECRET: ${SUMODOP_WEBHOOK_SECRET:-}
      SUMODOP_WEBHOOK_TOKEN: ${SUMODOP_WEBHOOK_TOKEN:-}
      GENIEACS_BASE_URL: ${GENIEACS_BASE_URL:-}
      GENIEACS_API_KEY: ${GENIEACS_API_KEY:-}
    volumes:
      - baileys_auth:/app/.baileys
    expose: ["3000"]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [fasty-net]
  fasty-bill:
    build:
      context: ./fasty-bill
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: fasty-bill:latest
    container_name: fasty-bill
    restart: always
    depends_on:
      fasty-api:
        condition: service_healthy
    ports:
      - "80:80"
    networks: [fasty-net]
    # NOTE: Baileys QR login sudah terintegrasi di fasty-api service
    # Container ini deprecated — bisa dihapus untuk production Baileys-only
volumes:
  mysql_data:
  baileys_auth:
networks:
  fasty-net:
    driver: bridge
