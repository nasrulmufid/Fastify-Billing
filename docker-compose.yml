name: fastify-billing
services:
  mysql:
    image: mysql:8.0
    container_name: fasty-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: fasty_bill
      MYSQL_USER: ${DB_USER:-fasty}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - mysql_data:/var/lib/mysql
    # MySQL internal only; expose through controlled admin tunnel if needed.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fasty-net]
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: fasty-gowa
    restart: always
    command: ["rest"]
    environment:
      APP_BASIC_AUTH: ${GOWA_BASIC_AUTH:?GOWA_BASIC_AUTH required}
      APP_HOST: 0.0.0.0
    volumes:
      - gowa_storages:/app/storages
      - gowa_statics:/app/statics
    expose: ["3000"]
    networks: [fasty-net]

  fasty-api:
    build:
      context: ./fasty-api
      dockerfile: Dockerfile
    image: fasty-api:latest
    container_name: fasty-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      gowa:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fasty_bill
      DB_USER: ${DB_USER:-fasty}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY required}
      SUMOPOD_URL: ${SUMOPOD_URL:-${SUMOPOD_BASE_URL:-https://api-pay-sandbox.sumopod.com}}
      SUMOPOD_BASE_URL: ${SUMOPOD_BASE_URL:-}
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      SUMOPOD_WEBHOOK_SECRET: ${SUMOPOD_WEBHOOK_SECRET:-}
      SUMOPOD_WEBHOOK_TOKEN: ${SUMOPOD_WEBHOOK_TOKEN:-}
      GENIEACS_BASE_URL: ${GENIEACS_BASE_URL:-}
      GENIEACS_API_KEY: ${GENIEACS_API_KEY:-}
      GOWA_BASE_URL: ${GOWA_BASE_URL:-http://gowa:3000}
      GOWA_BASIC_AUTH: ${GOWA_BASIC_AUTH:?GOWA_BASIC_AUTH required}
      GOWA_DEVICE_ID: ${GOWA_DEVICE_ID:-fasty-billing}
    expose: ["3000"]
    # API internal only; frontend nginx proxies /api.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [fasty-net]
  fasty-bill:
    build:
      context: ./fasty-bill
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: fasty-bill:latest
    container_name: fasty-bill
    restart: always
    depends_on:
      fasty-api:
        condition: service_healthy
    ports:
      - "9980:80"
    networks: [fasty-net]
    # NOTE: Baileys QR login sudah terintegrasi di fasty-api service
    # Container ini deprecated — bisa dihapus untuk production Baileys-only
volumes:
  mysql_data:
  gowa_storages:
  gowa_statics:
networks:
  fasty-net:
    driver: bridge
