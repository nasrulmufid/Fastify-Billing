# ============================================================
# NAS clients FreeRADIUS — satu entri per router Mikrotik.
# Tabel `nas` di MySQL juga dibaca oleh modul sql (clients),
# sehingga entri di bawah hanya fallback bila DB belum terisi.
# ============================================================
client fasty-api {
    ipaddr     = 0.0.0.0/0
    secret     = ${RADIUS_SECRET}
    require_message_authenticator = no
    nas_type   = other
}

# NAS dari database (tabel nas): aktifkan modul sql pada section clients
# di radiusd.conf jika ingin secret dikelola dari billing UI.
