# ============================================================
# nginx — reverse proxy + static SPA untuk fasty-bill
# Meneruskan /api ke backend fasty-api, sisanya static file.
# ============================================================
server {
    listen 80;
    server_name _;

    # Static frontend (Vite build output)
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Proxy ke backend API
    location /api/ {
        proxy_pass http://fasty-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (jika diperlukan)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Health check backend (optional)
    location /health {
        proxy_pass http://fasty-api:3000/health;
    }

    # SPA fallback — semua route selain di atas dilayani index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
